name: pr-policy.yml

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: PR format
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Проверить название и описание PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number
            });

            const errors = [];
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release)(\([a-z][a-z0-9-]*\))?(!)?: (\S(?:.*\S)?)$/u;
            const match = pr.title.match(pattern);

            if (!match || [...match[4]].length < 5 || [...pr.title].length > 100) {
              errors.push(
                "Название: тип(область): описание. " +
                "Описание — от 5 символов, всё название — до 100."
              );
            }

            const body = (pr.body ?? "")
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/```[\s\S]*?```/g, "")
              .replace(/~~~[\s\S]*?~~~/g, "")
              .replace(/\r\n/g, "\n")
              .trim();

            const required = [
              "Что изменено",
              "Зачем",
              "Как проверено",
              "Связанная задача"
            ];

            const headings = [...body.matchAll(/^##[ \t]+(.+?)[ \t]*$/gm)];

            if (
              headings.length !== required.length ||
              headings.some((heading, index) => heading[1] !== required[index])
            ) {
              errors.push(
                "Сохраните четыре раздела шаблона и их порядок: " +
                required.join(", ") + "."
              );
            } else {
              for (let index = 0; index < headings.length; index++) {
                const start = headings[index].index + headings[index][0].length;
                const end = headings[index + 1]?.index ?? body.length;
                const content = body.slice(start, end).trim();

                if (!/[\p{L}\p{N}]/u.test(content)) {
                  errors.push(
                    "Заполните раздел «" + required[index] + "»."
                  );
                }
              }
            }

            if (errors.length > 0) {
              for (const error of errors) {
                core.error(error);
              }

              core.setFailed("PR не соответствует правилам оформления.");
            } else {
              core.info("Название и описание PR соответствуют правилам.");
            }